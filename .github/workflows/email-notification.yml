name: Email Notification

on:
  push:
    branches:
      - main
      - feature_a
      - feature_b

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Cambios subidos a rama ${{ github.ref_name }}"
          to: sergioisaacsantana@gmail.com
          from: sergioisaacsantana@gmail.com
          body: |
            Se han realizado cambios en la rama: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Autor: ${{ github.actor }}
            Mensaje: ${{ github.event.head_commit.message }}